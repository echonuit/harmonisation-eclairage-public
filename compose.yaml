# Environnement de développement : l'application PHP et sa base PostGIS.
#
#     docker compose up -d --build              démarre les deux services
#     docker compose exec app composer install  installe les outils (une seule fois)
#     docker compose down                       arrête tout, les données sont conservées
#
# Les valeurs ${...} se règlent dans le fichier .env (modèle : .env.example).

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "${UID_GID:-0:0}"
    ports:
      - "127.0.0.1:${PORT_WEB:-8080}:80"
    volumes:
      # Le dépôt est monté tel quel : une modification du code est visible tout de suite.
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-projet.ini:ro
      - depots:/var/depots
    environment:
      DB_HOST: base
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-eclairage}
      DB_USER: ${DB_USER:-eclairage}
      DB_PASSWORD: ${DB_PASSWORD:-eclairage}
      DEPOTS_DIR: /var/depots
    depends_on:
      base:
        condition: service_healthy

  base:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-eclairage}
      POSTGRES_USER: ${DB_USER:-eclairage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eclairage}
    ports:
      # Ouvert sur votre machine seulement, pour s'y connecter depuis QGIS ou psql.
      - "127.0.0.1:${PORT_BASE:-5432}:5432"
    volumes:
      - base:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eclairage} -d ${DB_NAME:-eclairage}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  # Données de la base, conservées entre deux démarrages
  base:
  # Fichiers déposés par les gestionnaires, hors de la racine web
  depots:
