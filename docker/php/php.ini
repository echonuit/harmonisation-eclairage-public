; Réglages PHP du projet, chargés par le conteneur « app ».
; Après une modification : docker compose restart app
;
; Ce sont ici les valeurs par défaut de PHP. Elles sont trop basses pour le
; fichier de Marseille (6,4 Mo) : c'est à vous de les régler, voir la partie
; « En PHP sans framework » du sujet.

; Taille maximale d'un fichier déposé
upload_max_filesize = 2M

; Taille maximale d'une requête POST entière (doit dépasser upload_max_filesize)
post_max_size = 8M

; Mémoire maximale d'un script
memory_limit = 128M

; Durée maximale d'un script, en secondes
max_execution_time = 30

date.timezone = Europe/Paris
